<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#15152a"/>
    </linearGradient>
    <!-- Brand gradient -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- Soft purple blob -->
    <radialGradient id="blobA" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.7" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Card gradient -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- CTA gradient -->
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <ellipse cx="200" cy="120" rx="500" ry="400" fill="url(#blobA)"/>
  <ellipse cx="1000" cy="600" rx="500" ry="400" fill="url(#blobB)"/>

  <!-- ─── Navbar ─── -->
  <rect x="0" y="0" width="1200" height="62" fill="#0a0a0f" fill-opacity="0.7"/>
  <line x1="0" y1="62" x2="1200" y2="62" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Logo -->
  <rect x="60" y="20" width="24" height="24" rx="6" fill="url(#brand)"/>
  <text x="76" y="37" font-size="14" font-weight="800" fill="white" text-anchor="middle">P</text>
  <text x="98" y="40" font-size="17" font-weight="800" fill="#e8e8f0" letter-spacing="-0.5">PolyDoc</text>

  <!-- Nav links -->
  <text x="900" y="40" font-size="13" font-weight="500" fill="#9090a8">Features</text>
  <text x="970" y="40" font-size="13" font-weight="500" fill="#9090a8">Pipeline</text>
  <text x="1035" y="40" font-size="13" font-weight="500" fill="#9090a8">Quickstart</text>

  <!-- Nav CTA -->
  <rect x="1100" y="20" width="100" height="26" rx="7" fill="#e8e8f0"/>
  <text x="1150" y="38" font-size="12" font-weight="700" fill="#0a0a0f" text-anchor="middle">Get Started →</text>

  <!-- ─── Hero ─── -->
  <!-- Status badge -->
  <rect x="500" y="110" width="200" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="518" cy="123" r="3.5" fill="#10b981"/>
  <text x="600" y="128" font-size="12" fill="#9090a8" text-anchor="middle">v1.2.2 — Apache 2.0</text>

  <!-- Big headline -->
  <text x="600" y="200" font-size="56" font-weight="800" fill="#e8e8f0" text-anchor="middle" letter-spacing="-2">One pipeline.</text>
  <text x="600" y="258" font-size="56" font-weight="800" fill="#e8e8f0" text-anchor="middle" letter-spacing="-2">Every document.</text>
  <text x="600" y="316" font-size="56" font-weight="800" fill="url(#brand)" text-anchor="middle" letter-spacing="-2">Any modality.</text>

  <!-- Lede -->
  <text x="600" y="360" font-size="15" fill="#9090a8" text-anchor="middle">PolyDoc turns the messy reality of enterprise data — PDFs, slides, spreadsheets, emails,</text>
  <text x="600" y="380" font-size="15" fill="#9090a8" text-anchor="middle">audio, video, and web pages — into a clean, RAG-ready knowledge base.</text>

  <!-- CTA buttons -->
  <rect x="450" y="410" width="180" height="44" rx="10" fill="#e8e8f0"/>
  <text x="540" y="438" font-size="14" font-weight="600" fill="#0a0a0f" text-anchor="middle">Get started in 60s →</text>

  <rect x="640" y="410" width="170" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="725" y="438" font-size="14" font-weight="600" fill="#e8e8f0" text-anchor="middle">Explore features</text>

  <!-- ─── Stats row ─── -->
  <g transform="translate(120, 510)">
    <!-- card 1 -->
    <rect x="0" y="0" width="220" height="82" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="110" y="42" font-size="32" font-weight="800" fill="url(#brand)" text-anchor="middle">17+</text>
    <text x="110" y="65" font-size="11" font-weight="600" fill="#9090a8" text-anchor="middle" letter-spacing="2">FILE FORMATS</text>

    <rect x="240" y="0" width="220" height="82" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="350" y="42" font-size="32" font-weight="800" fill="url(#brand)" text-anchor="middle">8</text>
    <text x="350" y="65" font-size="11" font-weight="600" fill="#9090a8" text-anchor="middle" letter-spacing="2">LLM BACKENDS</text>

    <rect x="480" y="0" width="220" height="82" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="590" y="42" font-size="32" font-weight="800" fill="url(#brand)" text-anchor="middle">3</text>
    <text x="590" y="65" font-size="11" font-weight="600" fill="#9090a8" text-anchor="middle" letter-spacing="2">PDF STRATEGIES</text>

    <rect x="720" y="0" width="220" height="82" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="830" y="42" font-size="32" font-weight="800" fill="url(#brand)" text-anchor="middle">100%</text>
    <text x="830" y="65" font-size="11" font-weight="600" fill="#9090a8" text-anchor="middle" letter-spacing="2">OPEN SOURCE</text>
  </g>

  <!-- Trusted-by row -->
  <text x="600" y="640" font-size="10" font-weight="700" fill="#5a5a72" text-anchor="middle" letter-spacing="2.5">BUILT ON THE OPEN-SOURCE AI STACK</text>
  <g font-size="13" font-weight="500" fill="#9090a8" text-anchor="middle">
    <text x="350" y="680">PyTorch</text>
    <text x="450" y="680">Milvus</text>
    <text x="555" y="680">LangChain</text>
    <text x="650" y="680">FastAPI</text>
    <text x="735" y="680">Dask</text>
    <text x="840" y="680">Hugging Face</text>
  </g>
</svg>
